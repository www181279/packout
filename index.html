<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13213A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Packout">
<title>Packout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --floor:#E8ECEF; --paper:#fff; --ink:#13213A; --ink2:#55627A; --line:#D3DAE1;
  --placard:#FFC629; --placard-deep:#D9A300; --stop:#C8322B; --stop-bg:#FCEBEA; --go:#1B8757; --go-bg:#E3F4EC;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sign:"Barlow Condensed","Arial Narrow","Roboto Condensed",var(--body);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
/* no double-tap zoom: fast repeated taps on + and - must only count */
html,body,button,a,label,input,select,.pick,.irow{touch-action:manipulation}
button,.chips span,#nav{-webkit-user-select:none;user-select:none}
body{margin:0;background:var(--floor);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #2F6FED;outline-offset:2px}
h1,h2,h3,p{margin:0}
.sign{font-family:var(--sign);font-weight:700;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.small{font-size:14px}

/* frame */
#top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
#top .name{font:700 24px/1 var(--sign);letter-spacing:.02em}
#top .who{margin-left:auto;text-align:right;font-size:13px;line-height:1.25}
#top .who b{display:block;font-weight:600;font-size:15px}
#sync{display:inline-flex;align-items:center;gap:6px;color:#B9C4D6}
#sync i{width:8px;height:8px;border-radius:50%;background:#4CD19A}
#sync.off i{background:#FF7A70}
#view{max-width:720px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
#view.wide{max-width:1180px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
#nav button{border:0;background:none;padding:9px 4px 8px;display:grid;justify-items:center;gap:2px;font-size:13px;font-weight:500;color:var(--ink2)}
#nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button[aria-current=page]{color:var(--ink);font-weight:600}
#nav button[aria-current=page] span{box-shadow:0 3px 0 var(--placard)}

/* building blocks */
.h{font:700 30px/1.05 var(--sign);margin:4px 0 4px}
.lead{color:var(--ink2);margin-bottom:16px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.panel h2{font:600 17px/1.3 var(--body);margin-bottom:10px}
label.f{display:block;font-weight:600;font-size:15px;margin:14px 0 6px}
label.f:first-child{margin-top:0}
label.f small{font-weight:400;color:var(--ink2)}
input[type=text],input[type=url],input[type=number],input[type=search],select{
  width:100%;height:50px;border:1.5px solid #AEB8C4;border-radius:8px;background:#fff;padding:0 14px;font-size:17px}
input:focus,select:focus{border-color:var(--ink);outline:3px solid rgba(255,198,41,.7);outline-offset:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:8px;border:1.5px solid var(--ink);
  background:var(--ink);color:#fff;font-weight:600;font-size:17px;padding:8px 16px;text-align:center}
.btn.alt{background:#fff;color:var(--ink)}
.btn.quiet{border-color:var(--line);background:#fff;color:var(--ink);font-weight:500}
.btn.danger{border-color:var(--stop);background:#fff;color:var(--stop)}
.btn.sm{min-height:42px;font-size:15px;width:auto}
.btn+.btn{margin-top:10px}
.row{display:flex;gap:10px}.row>*{flex:1}.row .btn+.btn{margin-top:0}
.err{background:var(--stop-bg);border-left:4px solid var(--stop);color:#7A1612;padding:10px 12px;border-radius:6px;margin:12px 0;font-size:15px}
.note{background:#EEF2F6;border-radius:6px;padding:10px 12px;font-size:15px;color:var(--ink2);margin:12px 0}
.linkbtn{border:0;background:none;padding:6px 0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:500}

/* placard: the pallet's identity */
.placard{background:var(--placard);color:var(--ink);border-radius:10px;overflow:hidden;margin-bottom:12px}
.placard .stripes{height:14px;background:repeating-linear-gradient(-45deg,var(--ink) 0 14px,var(--placard) 14px 28px)}
.placard .in{padding:14px 16px 16px}
.placard .code{font:700 72px/.9 var(--sign);letter-spacing:.01em;margin:6px 0 8px}
.placard p{font-weight:500}
.placard.stop{background:var(--stop);color:#fff}
.placard.stop .stripes{background:repeating-linear-gradient(-45deg,#fff 0 14px,var(--stop) 14px 28px)}

/* pack trail */
.trail{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;align-items:center}
.trail span{background:var(--ink);color:#fff;border-radius:6px;padding:4px 10px;font:700 18px/1.2 var(--sign)}
.trail span.p{background:var(--placard);color:var(--ink)}
.trail button{margin-left:auto}

/* pick lists */
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;min-height:64px}
.pick:active{border-color:var(--ink)}
.pick .tag{flex:none;min-width:104px;white-space:nowrap;text-align:center;background:var(--placard);border-radius:6px;padding:9px 10px;font:700 24px/1 var(--sign)}
.pick .tag.box{background:#E3E9EF}
.pick b{display:block;font-weight:600}
.pick small{color:var(--ink2);font-size:14px}
.pick.new{border-style:dashed;border-color:#8793A3;justify-content:center;font-weight:600}
.pick.mine{border-color:var(--ink)}
.badge{display:inline-block;font-size:13px;font-weight:600;border-radius:20px;padding:1px 9px;background:#E3E9EF;color:var(--ink2);vertical-align:middle}
.badge.closed{background:var(--ink);color:#fff}

/* item form */
.photo{position:relative;display:grid;place-items:center;aspect-ratio:4/3;border:2px dashed #8793A3;border-radius:10px;background:#F4F6F8;overflow:hidden;text-align:center;font-weight:600}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.photo .again{position:absolute;right:8px;bottom:8px;background:var(--ink);color:#fff;border-radius:6px;padding:4px 10px;font-size:14px;font-weight:500;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0}
.chips span{display:block;border:1.5px solid #AEB8C4;border-radius:8px;padding:10px 14px;background:#fff;font-weight:500}
.chips input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.chips input:focus-visible+span{outline:3px solid #2F6FED;outline-offset:2px}
.qty{display:grid;grid-template-columns:56px 1fr 56px;gap:8px}
.qty button{border:1.5px solid var(--ink);border-radius:8px;background:#fff;font-size:26px;font-weight:600;line-height:1}
.qty input{text-align:center;font:700 26px/1 var(--sign)}
.withscan{display:flex;gap:8px}.withscan input{flex:1;min-width:0}.withscan .btn{width:auto;flex:none;min-height:50px;padding:8px 14px}
.withscan svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.tools2{margin-top:8px}.tools2 .btn{font-size:16px;min-height:48px;padding:6px 8px}
.tools2 svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;flex:none}
.filebtn{position:relative;overflow:hidden;cursor:pointer}.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.ocrrow{margin-bottom:10px}.ocrrow .pick{margin-bottom:6px}.ocrrow .pick b{font:700 24px/1.15 var(--sign);word-break:break-all}
.ocrw{display:flex;flex-wrap:wrap;gap:6px;padding-left:4px}
.ocrw button{border:1.5px solid #AEB8C4;border-radius:8px;padding:7px 12px;background:#fff;font-weight:600}
#scan-view{border-radius:10px;overflow:hidden;background:#0b1220;min-height:220px;margin-bottom:12px}
#scan-view video{width:100%!important;display:block}
.saved{background:var(--go-bg);border-left:4px solid var(--go);border-radius:6px;padding:10px 12px;margin-bottom:12px;font-weight:500}

/* pallets */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.ptile{border:0;text-align:left;background:var(--placard);border-radius:10px;padding:12px 14px;color:var(--ink)}
.ptile .code{font:700 38px/.95 var(--sign);white-space:nowrap}
.ptile.closed{background:#fff;border:1.5px solid var(--ink)}
.ptile p{font-size:14px;font-weight:500;margin-top:4px}
.boxhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.boxhead .code{font:700 26px/1 var(--sign)}
.lines{list-style:none;margin:10px 0 0;padding:0}
.lines li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.lines li b{font-weight:600}
.lines .n{margin-left:auto;font:700 20px/1 var(--sign)}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font-weight:500}
.seg button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}

/* inventory */
.totals{display:grid;grid-template-columns:repeat(4,1fr);background:var(--ink);color:#fff;border-radius:10px;margin-bottom:12px}
.totals div{padding:12px 6px;text-align:center;font-size:13px}
.totals b{display:block;font:700 30px/1 var(--sign)}
.tools{display:flex;gap:8px;margin-bottom:8px}
.tools input{flex:1}
.tools .btn{width:auto;min-height:50px;flex:none}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.fchips button{border:0;background:var(--ink);color:#fff;border-radius:20px;padding:5px 12px;font-size:14px}
.irow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px 8px 8px;margin-bottom:6px}
.irow img,.irow .noimg{width:64px;height:64px;border-radius:6px;object-fit:cover;background:#E3E9EF}
.irow .st{font:700 22px/1.1 var(--sign)}
.irow .d{font-size:14px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow .mid{min-width:0}
.irow .mid>span{display:block}
.irow .lc{display:block;font-size:15px;line-height:1.15;white-space:nowrap}
.irow .loc{text-align:right;font:700 17px/1.25 var(--sign)}
.irow .loc em{display:block;font-style:normal;font-size:24px}
.irow .wide{display:none}
@media (min-width:980px){
  .irow{grid-template-columns:64px 160px 1.2fr 1fr 1fr 1fr 1fr 120px 64px}
  .irow .wide{display:block;font-size:15px}
  .irow .mid>.d{display:none}
  .irow .lc{display:none}
  .irow .loc em{font-size:24px}
}
.empty{text-align:center;padding:36px 16px;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

/* sheets, toast, busy */
#sheet{position:fixed;inset:0;z-index:40;background:rgba(19,33,58,.55);display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .card{background:var(--floor);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .18s ease-out}
@media (min-width:700px){#sheet{align-items:center}#sheet .card{border-radius:16px}}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
@media (prefers-reduced-motion:reduce){#sheet .card{animation:none}}
#sheet h2{font:700 26px/1.1 var(--sign);margin-bottom:12px}
.big{width:100%;border-radius:10px;background:#E3E9EF;display:block;margin-bottom:12px;max-height:50vh;object-fit:contain}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0 0 14px}
dl.facts dt{color:var(--ink2)}dl.facts dd{margin:0;font-weight:600}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;margin:auto;max-width:520px;background:var(--ink);color:#fff;border-radius:8px;padding:12px 14px;font-weight:500;display:none}
#toast.on{display:block}#toast.bad{background:var(--stop)}#toast.good{background:var(--go)}
#busy{position:fixed;inset:0;z-index:70;background:rgba(232,236,239,.82);display:none;place-items:center;text-align:center;font-weight:600}
#busy.on{display:grid}
#busy i{display:block;width:38px;height:38px;margin:0 auto 12px;border:4px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
#print-root{display:none}
@media print{
  body{background:#fff}
  #top,#nav,#view,#sheet,#toast,#busy{display:none!important}
  #print-root{display:block}
}
</style>
<style id="mf-css">
.mf{font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#13213A;font-size:12px;line-height:1.4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.mf *{box-sizing:border-box}
.mf h1,.mf h2,.mf h3,.mf p{margin:0}
.mf .sg{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
.mf-head{border-bottom:4px solid #13213A;padding-bottom:14px;margin-bottom:18px}
.mf-head h1{font:700 40px/1 "Barlow Condensed","Arial Narrow",sans-serif}
.mf-head p{color:#55627A;font-size:13px;margin-top:4px}
.mf-tot{display:flex;gap:28px;margin:14px 0 0}
.mf-tot div{font-size:12px;color:#55627A}
.mf-tot b{display:block;color:#13213A;font:700 30px/1 "Barlow Condensed","Arial Narrow",sans-serif}
.mf-pal{margin-bottom:26px}
.mf-plac{display:flex;align-items:center;gap:18px;background:#FFC629;border-radius:8px;padding:10px 16px;margin-bottom:10px;break-after:avoid}
.mf-plac b{font:700 44px/1 "Barlow Condensed","Arial Narrow",sans-serif}
.mf-plac span{font-size:13px;font-weight:500}
.mf-plac .r{margin-left:auto;text-align:right}
.mf-box{margin:0 0 14px}
.mf-box h3{font:700 20px/1.2 "Barlow Condensed","Arial Narrow",sans-serif;border-bottom:2px solid #13213A;padding-bottom:3px;display:flex;justify-content:space-between;align-items:baseline;break-after:avoid}
.mf-box h3 small{font:500 12px "Barlow",sans-serif;color:#55627A}
.mf table{width:100%;border-collapse:collapse;table-layout:fixed}
.mf th.ph{width:58px}.mf th.st{width:20%}.mf th.q{width:64px}
.mf th{text-align:left;font-weight:600;font-size:11px;color:#55627A;padding:5px 8px 4px;border-bottom:1px solid #AEB8C4}
.mf td{padding:5px 8px;border-bottom:1px solid #D3DAE1;vertical-align:middle}
.mf tr{break-inside:avoid}
.mf td.ph{width:58px;padding-left:0}
.mf td.ph img{width:50px;height:50px;object-fit:cover;border-radius:4px;display:block;background:#E3E9EF}
.mf td.st{font:700 16px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;white-space:nowrap}
.mf td.q,.mf th.q{text-align:right;font:700 16px/1.1 "Barlow Condensed","Arial Narrow",sans-serif}
.mf th.q{font:600 11px "Barlow",sans-serif}
.mf-index h2{font:700 28px/1 "Barlow Condensed","Arial Narrow",sans-serif;border-bottom:4px solid #13213A;padding-bottom:8px;margin-bottom:6px}
.mf-index td.where{font:700 16px/1.1 "Barlow Condensed","Arial Narrow",sans-serif}
@media print{
  .mf-pal+.mf-pal,.mf-index{break-before:page}
  .mf-find{display:none}
}
.mf .ps-meta{color:#55627A;font-size:12px;margin:-4px 0 12px}
.mf .ps-h{font:700 18px/1.2 "Barlow Condensed","Arial Narrow",sans-serif;margin:14px 0 2px}
.mf-sum{margin-bottom:16px}
/* box labels */
.lb{font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#13213A;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.lb *{box-sizing:border-box}
.lb-page{display:grid;gap:.2in;break-after:page;page-break-after:always}
.lb-page:last-child{break-after:auto;page-break-after:auto}
.lbl{border:3px solid #13213A;border-radius:.12in;padding:.18in .22in;overflow:hidden;display:flex;flex-direction:column;break-inside:avoid}
.lb-top{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.lb-pal{background:#FFC629;border-radius:6px;padding:2px 12px;font:700 26pt/1.15 "Barlow Condensed","Arial Narrow",sans-serif}
.lb-box{font:700 84pt/.95 "Barlow Condensed","Arial Narrow",sans-serif;margin:.06in 0 .08in;white-space:nowrap}
.lbl table{width:100%;border-collapse:collapse;font-size:11pt}
.lbl td{padding:3px 6px 3px 0;border-top:1px solid #AEB8C4;vertical-align:top}
.lbl td.s{font:700 14pt/1.1 "Barlow Condensed","Arial Narrow",sans-serif;white-space:nowrap}
.lbl td.q{text-align:right;font:700 14pt/1.1 "Barlow Condensed","Arial Narrow",sans-serif;padding-right:0}
.lbl .more{font-size:10pt;color:#55627A;margin-top:4px}
.lb-l4 .lb-page{grid-template-columns:1fr 1fr;grid-template-rows:4.75in 4.75in}
.lb-l4 .lb-box{font-size:70pt}
.lb-l2 .lb-page{grid-template-columns:1fr;grid-template-rows:4.75in 4.75in}
.lb-l2 .lb-box{font-size:130pt}.lb-l2 .lb-pal{font-size:34pt}.lb-l2 .lbl table{font-size:13pt}
.lb-t46 .lb-page{display:block}
.lb-t46 .lbl{width:4in;height:5.95in;border:0;border-radius:0;padding:.22in}
.lb-t46 .lb-box{font-size:92pt}
</style>
</head>
<body>
<header id="top">
  <div><div class="name">Packout</div><div id="sync" class="small"><i></i><span>Not connected</span></div></div>
  <div class="who" id="who"></div>
</header>
<main id="view"></main>
<nav id="nav" hidden>
  <button data-tab="pack"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg><span>Pack</span></button>
  <button data-tab="pallets"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="10" rx="1"/><path d="M3 17h18M5 17v3M12 17v3M19 17v3"/></svg><span>Pallets</span></button>
  <button data-tab="inventory"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Inventory</span></button>
  <button data-tab="more"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>Export</span></button>
</nav>
<div id="sheet"><div class="card" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<div id="busy"><div><i></i><span></span></div></div>
<div id="print-root"></div>

<script>
/* ============================================================
   Packout: packing inventory for a store closing.
   Data lives in Supabase. Optional: hardcode your project here
   so employees never see the connection screen.
   ============================================================ */
const PRESET_URL = '';   // e.g. 'https://abcd1234.supabase.co'
const PRESET_KEY = '';   // the anon / publishable key
const BUCKET = 'item-photos';
const GENDERS = ['Women','Men','Girls','Boys','Baby','Unisex'];
const SEASONS = ['Spring','Summer','Fall','Winter','All year'];

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pCode = id => 'Pallet ' + id;
const bCode = id => 'Box ' + id;       // box numbers run once across the whole store
const normStyle = s => String(s || '').trim().replace(/\s+/g, ' ').toUpperCase();
const nf = n => Number(n || 0).toLocaleString();
const unit = (n, w) => n === 1 ? w : w + (w.endsWith('x') ? 'es' : 's');
const plural = (n, w) => `${nf(n)} ${w}${n === 1 ? '' : (w.endsWith('x') ? 'es' : 's')}`;
const store = {

function uuid(){
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = b[6] & 15 | 64; b[8] = b[8] & 63 | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}

/* ---------- Supabase over plain HTTPS (no library needed) ---------- */
let cfg = store.get('cfg') || (PRESET_URL && PRESET_KEY ? { url: PRESET_URL, key: PRESET_KEY } : null);
class ApiError extends Error { constructor(msg, status, code){ super(msg); this.status = status; this.code = code; } }
async function call(path, { method = 'GET', body, headers = {}, timeout = 20000, c = cfg } = {}){
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), timeout);
  let res;
  try {
    res = await fetch(c.url + path, { method, body, signal: ctrl.signal, cache: 'no-store',
      headers: { apikey: c.key, Authorization: 'Bearer ' + c.key, ...headers } });
  } catch (e) {
    throw new ApiError('No connection to the database. Check the internet on this phone and try again. Nothing was lost.', 0, 'NETWORK');
  } finally { clearTimeout(t); }
  const text = await res.text(); let json = null;
  try { json = text ? JSON.parse(text) : null; } catch {}
  if (!res.ok) throw new ApiError((json && (json.message || json.error)) || text || res.statusText, res.status, json && (json.code || json.statusCode || json.error));
  return json;
}
const JSONH = { 'Content-Type': 'application/json', Prefer: 'return=representation' };
const db = {
  get: (table, query) => call(`/rest/v1/${table}?${query}`),
  async all(table){
    const out = [];
    for (let off = 0; ; off += 1000){
      const page = await call(`/rest/v1/${table}?select=*&order=created_at.asc&limit=1000&offset=${off}`);
      out.push(...page); if (page.length < 1000) return out;
    }
  },
  insert: (table, row) => call(`/rest/v1/${table}`, { method: 'POST', body: JSON.stringify(row), headers: JSONH }).then(r => r[0]),
  update: (table, query, patch) => call(`/rest/v1/${table}?${query}`, { method: 'PATCH', body: JSON.stringify(patch), headers: JSONH }).then(r => r[0]),
  remove: (table, query) => call(`/rest/v1/${table}?${query}`, { method: 'DELETE', headers: JSONH })
};
const eq = v => 'eq.' + encodeURIComponent(v);
const rpc = (fn, args) => call('/rest/v1/rpc/' + fn, { method: 'POST', body: JSON.stringify(args), headers: { 'Content-Type': 'application/json' } });
const isDup = e => e.code === '23505' || e.status === 409;
async function uploadPhoto(path, blob){
  try {
    await call(`/storage/v1/object/${BUCKET}/${path}`, { method: 'POST', body: blob, timeout: 60000,
      headers: { 'Content-Type': 'image/jpeg', 'x-upsert': 'true', 'cache-control': '31536000' } });
  } catch (e) {
    if (/exist|duplicate/i.test(e.message + e.code)) return;      // already uploaded on an earlier try
    if (e.code !== 'NETWORK') e.message = 'Photo upload failed: ' + e.message;
    throw e;
  }
}
// Remove photo files for deleted items. Best effort: the inventory rows are already gone.
async function removePhotos(paths){
  const prefixes = paths.filter(Boolean).flatMap(p => [p, 'thumb/' + p]);
  if (prefixes.length) try { await call(`/storage/v1/object/${BUCKET}`, { method: 'DELETE', body: JSON.stringify({ prefixes }), headers: { 'Content-Type': 'application/json' } }); } catch {}
}
const photoUrl = (path, c = cfg) => path ? `${c.url}/storage/v1/object/public/${BUCKET}/${path}` : '';
const thumbUrl = it => it.photo_path ? photoUrl('thumb/' + it.photo_path) : '';

function shrink(file, max, quality){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('Could not read that photo. Take it again.')), 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read that photo. Take it again.')); };
    img.src = url;
  });
}

async function loadAll(){
  const [pallets, boxes, styles, items] = await Promise.all(['pallets','boxes','styles','items'].map(t => db.all(t)));
  data = { pallets, boxes, styles, items };
  idx = { pal: new Map(pallets.map(p => [p.id, p])), box: new Map(boxes.map(b => [b.id, b])), style: new Map(styles.map(s => [s.style_number, s])) };

}

/* ---------- barcode scanner (camera) ---------- */
const SCAN_LIB = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
let scanner = null;
function loadScript(src){
  return new Promise((ok, no) => { const el = document.createElement('script'); el.src = src; el.onload = ok;
    el.onerror = () => { el.remove(); no(new Error('The scanner could not load. Check the internet on this phone.')); }; document.head.appendChild(el); });
}
function stopScanner(){
  const sc = scanner; scanner = null;
  if (sc) Promise.resolve().then(() => sc.stop()).then(() => sc.clear()).catch(() => {});
}
async function openScanner(target){
  openSheet(`<h2>Scan the ${target === 'style' ? 'style' : 'tag'} barcode</h2>
    <div id="scan-view"></div><div id="scan-msg"><p class="lead">Starting the camera</p></div>
    <button class="btn alt" data-act="close-sheet">Cancel</button>`);
  const say = html => { const m = $('#scan-msg'); if (m) m.innerHTML = html; };
  try {
    if (!window.Html5Qrcode) await loadScript(SCAN_LIB);
    if (!$('#scan-view')) return;
    const sc = new Html5Qrcode('scan-view', { experimentalFeatures: { useBarCodeDetectorIfSupported: true }, verbose: false });
    scanner = sc; let done = false;
    await sc.start({ facingMode: 'environment' },
      { fps: 12, qrbox: (w, h) => ({ width: Math.max(60, Math.floor(w * .9)), height: Math.max(60, Math.floor(Math.min(h * .55, 190))) }) },
      text => {
        if (done || scanner !== sc) return; done = true;
        const val = String(text).trim();
        closeSheet(); if (navigator.vibrate) navigator.vibrate(60);
        if (target === 'style') { const i = $('#k-style'); if (i) { i.value = val; act['check-style'](); } }
        else { const i = $('#k-tag'); if (i) { i.value = val; toast('Tag ' + val, 'good'); } }
      }, () => {});
    if (scanner !== sc) return sc.stop().then(() => sc.clear()).catch(() => {});   // closed while starting
    say('<p class="lead">Hold the barcode inside the frame. It reads on its own.</p>');
  } catch (e) {
    scanner = null;
    const m = String(e && (e.name || '') + ' ' + (e.message || e));
    say(`<div class="err">${/NotAllowed|Permission/i.test(m) ? 'The camera is blocked for this app. Allow the camera in the browser settings, then try again. You can still type the number.'
      : /NotFound|Overconstrained/i.test(m) ? 'No camera was found on this device. Type the number instead.' : esc(e.message || 'The camera could not start.') + ' You can still type the number.'}</div>`);
  }
}

/* ---------- text reader (photo of the tag) ---------- */
const OCR_LIB = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
let ocrWorker = null, ocrRun = 0;
function ocrRows(text){
  const seen = new Set();
  return String(text || '').split(/\n+/).map(l => l.replace(/[^A-Za-z0-9 \-_\/.#]/g, ' ').replace(/\s+/g, ' ').trim().toUpperCase())
    .filter(l => l.replace(/[^A-Z0-9]/g, '').length >= 2 && !seen.has(l) && seen.add(l)).slice(0, 14);
}
async function runOcr(file){
  const run = ++ocrRun, url = URL.createObjectURL(file);
  const again = `<label class="btn alt filebtn">Take the photo again<input id="k-ocr" type="file" accept="image/*" capture="environment"></label>`;
  openSheet(`<h2>Reading the tag</h2><img class="big" style="max-height:26vh" src="${url}" alt="Your photo of the tag">
    <div id="ocr-out"><p class="lead" id="ocr-msg">Getting the reader ready</p></div>
    <button class="btn quiet" data-act="close-sheet" style="margin-top:10px">Cancel</button>`);
  const msg = t => { const m = $('#ocr-msg'); if (m) m.textContent = t; };
  try {
    if (!window.Tesseract) await loadScript(OCR_LIB);
    if (!ocrWorker) {
      ocrWorker = await Tesseract.createWorker('eng', 1, { logger: m => {
        if (m.status === 'recognizing text') msg('Reading the text, ' + Math.round(m.progress * 100) + '%');
        else msg('Getting the reader ready. The first time takes longer.'); } });
      await ocrWorker.setParameters({ tessedit_pageseg_mode: '11' });     // scattered short lines, as on a tag
    }
    msg('Reading the text');
    const { data } = await ocrWorker.recognize(await shrink(file, 1600, .92));
    if (run !== ocrRun || !$('#ocr-out')) return;
    const rows = ocrRows(data.text);
    $('#sheet h2').textContent = rows.length ? 'Which one is the style number?' : 'No text found';
    $('#ocr-out').innerHTML = rows.length ? rows.map(r => {
      const words = r.split(' ').filter(w => w.replace(/[^A-Z0-9]/g, '').length >= 2), known = styleRow(normStyle(r));
      return `<div class="ocrrow"><button class="pick" data-act="ocr-pick" data-v="${esc(r)}"><span><b>${esc(r)}</b>${known ? `<small>Known style, on ${pCode(known.pallet_id)}</small>` : ''}</span></button>
        ${words.length > 1 ? `<div class="ocrw">${words.map(w => `<button data-act="ocr-pick" data-v="${esc(w)}">${esc(w)}${styleRow(w) ? ' (known)' : ''}</button>`).join('')}</div>` : ''}</div>`; }).join('')
      + `<p class="small muted" style="margin:4px 0 10px">Tap a whole row, or one of its parts. You can correct it before checking.</p>` + again
      : `<p class="lead">Move closer, keep the tag flat and upright, with good light.</p>` + again;
  } catch (e) {
    if ($('#ocr-out')) $('#ocr-out').innerHTML = `<div class="err">${esc(e.message || 'The reader could not start.')} You can still type the number.</div>` + again;
  } finally { URL.revokeObjectURL(url); }
}

function manifestHTML(rows, { title, img, sheets }){
  const by = (list, k) => { const m = new Map(); list.forEach(r => (m.get(r[k]) || m.set(r[k], []).get(r[k])).push(r)); return [...m].sort((a, b) => a[0] > b[0] ? 1 : -1); };
  const cmp = (a, b) => a.style_number.localeCompare(b.style_number, undefined, { numeric: true }) || a.color.localeCompare(b.color);
  const tot = `<div class="mf-tot"><div><b>${nf(sumQty(rows))}</b>${unit(sumQty(rows), 'piece')}</div><div><b>${nf(new Set(rows.map(r => r.style_number)).size)}</b>${unit(new Set(rows.map(r => r.style_number)).size, 'style')}</div>
    <div><b>${nf(new Set(rows.map(r => r.box_id)).size)}</b>${unit(new Set(rows.map(r => r.box_id)).size, 'box')}</div><div><b>${nf(new Set(rows.map(r => r.pallet_id)).size)}</b>${unit(new Set(rows.map(r => r.pallet_id)).size, 'pallet')}</div></div>`;
  const pals = by(rows, 'pallet_id').map(([pid, pr]) => {
    const sum = !sheets ? '' : `<p class="ps-meta">Pallet breakdown, printed ${new Date().toLocaleString([], { dateStyle: 'long', timeStyle: 'short' })}${idx.pal.get(pid)?.status === 'closed' ? '. Pallet closed.' : '. Pallet still open: more may be added.'}</p>
      <h3 class="ps-h">Styles on this pallet</h3><table class="mf-sum"><thead><tr><th class="st">Style</th><th>Brand</th><th>Colors</th><th>Boxes</th><th class="q">Pieces</th></tr></thead><tbody>
      ${by(pr, 'style_number').sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true })).map(([st, sr]) => `<tr><td class="st">${esc(st)}</td><td>${esc([...new Set(sr.map(r => r.brand))].join(', '))}</td><td>${esc([...new Set(sr.map(r => r.color))].join(', '))}</td><td>${[...new Set(sr.map(r => r.box_id))].sort((a, b) => a - b).map(bCode).join(', ')}</td><td class="q">${nf(sumQty(sr))}</td></tr>`).join('')}
      </tbody></table><h3 class="ps-h">Box by box</h3>`;
    return `<section class="mf-pal"><div class="mf-plac"><b>${pCode(pid)}</b>
      <span class="r">${plural(new Set(pr.map(r => r.box_id)).size, 'box')}, ${plural(new Set(pr.map(r => r.style_number)).size, 'style')}<br>${plural(sumQty(pr), 'piece')}</span></div>${sum}
      ${by(pr, 'box_id').map(([bid, br]) => `<div class="mf-box"><h3>${bCode(bid)} <small>${plural(sumQty(br), 'piece')} on ${pCode(pid)}</small></h3>
        <table><thead><tr>${img ? '<th class="ph"></th>' : ''}<th class="st">Style</th><th>Color</th><th>Brand</th><th>Tag</th><th>Gender</th><th>Season</th><th class="q">Qty</th></tr></thead><tbody>
        ${br.sort(cmp).map(r => `<tr>${img ? `<td class="ph">${r.photo_path ? `<img alt="" src="${esc(img(r))}">` : ''}</td>` : ''}<td class="st">${esc(r.style_number)}</td><td>${esc(r.color)}</td><td>${esc(r.brand)}</td><td>${esc(r.tag_number || '')}</td><td>${esc(r.gender)}</td><td>${esc(r.season)}</td><td class="q">${nf(r.quantity)}</td></tr>`).join('')}
        </tbody></table></div>`).join('')}</section>`;
  }).join('');
  const index = by(rows, 'style_number').sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true })).map(([s, sr]) => `<tr><td class="st">${esc(s)}</td><td>${esc([...new Set(sr.map(r => r.brand))].join(', '))}</td>
    <td>${esc([...new Set(sr.map(r => r.color))].join(', '))}</td><td class="where">${[...new Set(sr.map(r => pCode(r.pallet_id)))].join(', ')}</td>
    <td>${[...new Set(sr.map(r => bCode(r.box_id)))].join(', ')}</td><td class="q">${nf(sumQty(sr))}</td></tr>`).join('');
  if (sheets) return `<div class="mf">${pals}</div>`;
  return `<div class="mf"><header class="mf-head"><h1>${esc(title)}</h1><p>Packed inventory as of ${new Date().toLocaleString([], { dateStyle: 'long', timeStyle: 'short' })}</p>${tot}</header>
    ${pals}<section class="mf-index"><h2>Style index</h2><table><thead><tr><th class="st">Style</th><th>Brand</th><th>Colors</th><th>Pallet</th><th>Boxes</th><th class="q">Pieces</th></tr></thead><tbody>${index}</tbody></table></section></div>`;
}
/* ---------- printing: pallet breakdowns and box labels ---------- */
const LETTER = 'size:letter;margin:.5in';
const LABELS = { l4: ['4 per Letter page', 'size:letter;margin:.5in', 4, 7], l2: ['2 per Letter page (large)', 'size:letter;margin:.5in', 2, 7], t46: ['4 x 6 inch label printer', 'size:4in 6in;margin:0', 1, 9] };
let labelSize = store.get('labels') || 'l4';
async function printHTML(html, page){
  await withBusy('Getting it ready to print', async () => {
    let st = $('#print-page'); if (!st) { st = document.createElement('style'); st.id = 'print-page'; document.head.appendChild(st); }
    st.textContent = `@page{${page}}`;
    const root = $('#print-root'); root.innerHTML = html;
    const imgs = [...root.querySelectorAll('img')]; let n = 0;
    await Promise.race([Promise.all(imgs.map(im => new Promise(ok => { const d = () => { setBusy(`Loading photos ${++n} of ${imgs.length}`); ok(); }; im.complete ? d() : (im.onload = im.onerror = d); }))), new Promise(ok => setTimeout(ok, 45000))]);
    if (document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, new Promise(ok => setTimeout(ok, 3000))]);
  });
  window.print();
}
const palletIds = scope => data.pallets.filter(p => scope !== 'closed' || p.status === 'closed').map(p => p.id).sort((a, b) => a - b);
function printSheets(ids, photos = true){
  const set = new Set(ids), rows = joined().filter(r => set.has(r.pallet_id));
  if (!rows.length) return toast(ids.length ? 'Nothing is packed on ' + (ids.length === 1 ? pCode(ids[0]) : 'those pallets') + ' yet.' : 'No pallets are closed yet. Close a pallet when it is ready.', 'bad');
  return printHTML(manifestHTML(rows, { sheets: true, img: photos ? thumbUrl : null }), LETTER);
}
function labelsHTML(boxes, size){
  const [, , per, max] = LABELS[size];
  const one = b => {
    const m = new Map(); itemsOf('box_id', b.id).forEach(i => { const g = m.get(i.style_number) || m.set(i.style_number, { colors: new Set(), qty: 0 }).get(i.style_number); g.colors.add(i.color); g.qty += i.quantity; });
    const list = [...m].sort((a, c) => a[0].localeCompare(c[0], undefined, { numeric: true })), total = list.reduce((n, [, g]) => n + g.qty, 0);
    return `<div class="lbl"><div class="lb-top"><span class="lb-pal">${pCode(b.pallet_id)}</span><span>${list.length ? plural(total, 'piece') : 'Nothing recorded yet'}</span></div>
      <div class="lb-box">${bCode(b.id)}</div>
      <table><tbody>${list.slice(0, max).map(([st, g]) => `<tr><td class="s">${esc(st)}</td><td>${esc([...g.colors].join(', '))}</td><td class="q">${nf(g.qty)}</td></tr>`).join('')}</tbody></table>
      ${list.length > max ? `<div class="more">and ${plural(list.length - max, 'more style')}. See the pallet breakdown.</div>` : ''}</div>`;
  };
  const pages = []; for (let i = 0; i < boxes.length; i += per) pages.push(boxes.slice(i, i + per));
  return `<div class="lb lb-${size}">${pages.map(pg => `<div class="lb-page">${pg.map(one).join('')}</div>`).join('')}</div>`;
}
function printLabels(boxes){
  boxes = boxes.slice().sort((a, b) => a.pallet_id - b.pallet_id || a.id - b.id);
  if (!boxes.length) return toast('There are no boxes to label yet.', 'bad');
  return printHTML(labelsHTML(boxes, labelSize), LABELS[labelSize][1]);
}

function download(name, text, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const joinHash = withName => '#join=' + btoa(unescape(encodeURIComponent(JSON.stringify({ u: cfg.url, k: cfg.key, ...(withName && me ? { n: me.name } : {}) }))));
const fileStamp = () => new Date().toISOString().slice(0, 10);
async function embedThumbs(rows){
  const map = new Map(), todo = rows.filter(r => r.photo_path); let done = 0;
  const one = async r => {
    try { const b = await (await fetch(thumbUrl(r))).blob();
      map.set(r.id, await new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = no; fr.readAsDataURL(b); }));
    } catch { map.set(r.id, thumbUrl(r)); }
    setBusy(`Adding photos ${++done} of ${todo.length}`);
  };
  const q = todo.slice(); await Promise.all(Array.from({ length: 6 }, async () => { while (q.length) await one(q.shift()); }));
  return map;
}

/* ---------- actions ---------- */
const act = {
  async connect(){
    const c = { url: $('#c-url').value.trim().replace(/\/+$/, '').replace(/\/rest\/v1$/, ''), key: $('#c-key').value.trim() };
    const fail = m => $('#c-err').innerHTML = `<div class="err">${m}</div>`;
    if (!/^https?:\/\/.+/.test(c.url) || !c.key) return fail('Enter both the project URL and the public key.');
    await withBusy('Connecting', async () => {
      try { await call('/rest/v1/pallets?select=id&limit=1', { c }); }
      catch (e) {
        if (e.code === 'NETWORK') return fail('Could not reach that address. Check the project URL.');
        if (e.status === 401 || e.status === 403) return fail('The database refused that key. Copy the anon (public) key again.');
        return fail('Connected, but the tables are missing. Run the setup script in the Supabase SQL editor first, then try again.');
      }
      cfg = c; store.set('cfg', c); await refresh(); render();
    });
  },
  'save-who'(){
    const name = $('#w-name').value.trim();
    if (!name) return $('#w-err').innerHTML = '<div class="err">Type your name.</div>';
    me = { name }; store.set('me', me); render();
  },
  'change-who'(){ me = null; render(); },
  disconnect(){
    openSheet(`<h2>Disconnect this phone?</h2><p class="lead">Nothing is deleted from the database. This phone will need the invite link again.</p>
      <div class="row"><button class="btn alt" data-act="close-sheet">Cancel</button><button class="btn danger" data-act="disconnect-yes">Disconnect</button></div>`);
  },
  'disconnect-yes'(){ store.del('cfg'); store.del('me'); cfg = null; me = null; closeSheet(); render(); },
  'close-sheet': closeSheet,

  /* pack */
  'pack-reset'(){ pack = newPack(pack.last, pack.last && { ...pack.last }); render(); },
  'pack-fresh'(){ pack = newPack(pack.last); render(); },
  'same-box'(){ pack = newPack(pack.last, { pallet: pack.pallet, box: pack.box }); render(); scrollTo(0, 0); const i = $('#k-style'); if (i) i.focus(); },
  async 'check-style'(){
    const s = normStyle($('#k-style').value);
    pack.style = s; pack.saved = null;
    if (!s) return packFail(new Error('Type the style number from the tag.'));
    await withBusy('Checking style ' + s, async () => {
      try {
        const [found] = await Promise.all([db.get('styles', 'select=*&style_number=' + eq(s)), loadAll()]);
        pack.err = '';
        const kb = pack.keep && idx.box.get(pack.keep.box);
        if (found[0]) { Object.assign(pack, { stage: 'box', pallet: found[0].pallet_id, known: true, owner: found[0].created_by }); applyKeep(); }
        else if (kb && kb.status === 'open') return await claim(kb.pallet_id, 'keep');
        else pack.stage = 'pallet';
        render(); scrollTo(0, 0);
      } catch (e) { packFail(e); }
    });
  },
  async 'choose-pallet'(el){ await claim(+el.dataset.id); },
  'new-pallet'(){
    openSheet(`<h2>Start a new pallet</h2>
      <p class="lead">The app gives the pallet the next number. Write that number on the pallet in big letters.</p>
      <div class="row"><button class="btn alt" data-act="close-sheet">Cancel</button><button class="btn" data-act="new-pallet-yes">Start pallet</button></div>`);
  },
  async 'new-pallet-yes'(){
    closeSheet();
    await withBusy('Starting pallet', async () => {
      try {
        // Last check before making a pallet: did someone claim this style a second ago?
        const found = await db.get('styles', 'select=*&style_number=' + eq(pack.style));
        if (found[0]) return blocked(found[0]);
        const p = await db.insert('pallets', { created_by: me.name });

  },
  async 'choose-box'(el){ pack.box = +el.dataset.id; pack.last = { pallet: pack.pallet, box: pack.box }; store.set('last', pack.last); pack.stage = 'item'; pack.err = ''; pack.form = null; render(); scrollTo(0, 0); },
  async 'new-box'(){

    await withBusy('Starting box', async () => {
      try {
        const b = await db.insert('boxes', { pallet_id: pack.pallet, created_by: me.name });
        data.boxes.push(b); idx.box.set(b.id, b);
        pack.last = { pallet: pack.pallet, box: b.id }; store.set('last', pack.last);

  async 'release-style'(){

  async 'reopen-pallet'(el){ await setStatus('pallets', +el.dataset.id, 'open'); },
  qty(el){ const i = $('#k-qty'); i.value = Math.max(1, (parseInt(i.value, 10) || 0) + (+el.dataset.d)); },
  async 'save-item'(){
    const f = readForm(); pack.form = f;
    const miss = !pack.photo ? 'Take a photo of the item first.' : !f.color ? 'Type the color.' : !f.brand ? 'Type the brand.'
      : !(f.qty >= 1) ? 'Quantity must be 1 or more.' : !f.gender ? 'Pick a gender.' : !f.season ? 'Pick a season.' : '';
    const showErr = m => { pack.err = m; const p = pack.photo; render(); if (p) showPhoto(p); };
    if (miss) return showErr(miss);
    await withBusy('Saving to the database', async () => {
      try {
        const id = pack.id, path = id + '.jpg';
        const [full, thumb] = await Promise.all([shrink(pack.photo, 1400, .82), shrink(pack.photo, 280, .72)]);
        await Promise.all([uploadPhoto(path, full), uploadPhoto('thumb/' + path, thumb)]);
        const row = { id, style_number: pack.style, box_id: pack.box, color: f.color, brand: f.brand, tag_number: f.tag, quantity: f.qty,
          gender: f.gender, season: f.season, photo_path: path, created_by: me.name };
        let saved;
        try { saved = await db.insert('items', row); }
        catch (e) {             // a retry after a lost reply: the row may already be there
          const again = e.code === '23505' ? await db.get('items', 'select=*&id=' + eq(id)) : [];
          if (!again[0]) throw e; saved = again[0];
        }
        data.items.push(saved);
        pack.last = { pallet: pack.pallet, box: pack.box }; store.set('last', pack.last);
        Object.assign(pack, { id: uuid(), photo: null, err: '', form: { ...f, color: '', tag: '', qty: 1 },
          saved: `Saved: ${nf(f.qty)} x ${pack.style} ${f.color} in ${bCode(pack.box)} on ${pCode(pack.pallet)}. Add the next color, or start another style.` });

      } catch (e) {
        showErr(/STYLE_PALLET/.test(e.message) ? 'This style belongs on a different pallet. Start the style again to see where it goes.' : e.code === '23503' ? 'This box or style was removed by someone. Tap "Start another style" and enter the style again.' : e.message + ' Tap Save item to try again.');
      }

  'open-pallet'(el){ palView = el.dataset.id ? +el.dataset.id : null; render(); scrollTo(0, 0); },
  async 'toggle-pallet'(el){ const p = idx.pal.get(+el.dataset.id); await setStatus('pallets', p.id, p.status === 'open' ? 'closed' : 'open'); },

  async 'del-pallet'(el){ palView = null; await mutate('Deleting', () => db.remove('pallets', 'id=' + eq(el.dataset.id))); },

    if (el.dataset.id) return printSheets([+el.dataset.id]);

  /* export */
  async 'export-pdf'(){
    const { rows, photos } = exportRows(); if (!rows.length) return toast('There is nothing to export yet.', 'bad');
    await printHTML(manifestHTML(rows, { title: exTitle, img: photos ? thumbUrl : null }), LETTER);
  },
  async 'export-html'(){
    const { rows, photos } = exportRows(); if (!rows.length) return toast('There is nothing to export yet.', 'bad');
    await withBusy('Building the report', async () => {
      const map = photos ? await embedThumbs(rows) : null;
      const body = manifestHTML(rows, { title: exTitle, img: photos ? r => map.get(r.id) : null });
      download(`inventory-${fileStamp()}.html`, `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(exTitle)}</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#E8ECEF}.page{max-width:980px;margin:0 auto;background:#fff;padding:32px 28px}.mf{font-size:14px}.mf-find{width:100%;height:46px;border:1.5px solid #AEB8C4;border-radius:8px;padding:0 14px;font:inherit;font-size:16px;margin-bottom:20px}
.mf table{display:table}.scroll{overflow-x:auto}@page{size:letter;margin:.5in}@media print{body{background:#fff}.page{padding:0;max-width:none}}${$('#mf-css').textContent}</style></head>
<body><div class="page"><input class="mf-find" type="search" placeholder="Find a style, color, brand, tag, pallet or box" aria-label="Find in inventory">${body}</div>
<script>document.querySelector('.mf-find').addEventListener('input',function(){var q=this.value.trim().toLowerCase();
document.querySelectorAll('.mf tbody tr').forEach(function(r){r.hidden=!!q&&(r.textContent+' '+((r.closest('.mf-box')||r).querySelector('h3')||{textContent:''}).textContent).toLowerCase().indexOf(q)<0});
document.querySelectorAll('.mf-box').forEach(function(b){b.hidden=!b.querySelector('tbody tr:not([hidden])')});
document.querySelectorAll('.mf-pal').forEach(function(p){p.hidden=!p.querySelector('.mf-box:not([hidden])')})});<\/script></body></html>`, 'text/html');
      toast('Downloaded', 'good');
    });
  },
  'export-csv'(){
    const { rows } = exportRows(); if (!rows.length) return toast('There is nothing to export yet.', 'bad');
    const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const lines = [['Pallet','Box','Style number','Color','Brand','Tag number','Quantity','Gender','Season','Packed by','Packed at','Photo']]
      .concat(rows.sort((a, b) => a.pallet_id - b.pallet_id || a.box_id - b.box_id).map(r => [pCode(r.pallet_id), bCode(r.box_id), r.style_number, r.color, r.brand, r.tag_number, r.quantity, r.gender, r.season, r.created_by, r.created_at, photoUrl(r.photo_path)]));
    download(`inventory-${fileStamp()}.csv`, '﻿' + lines.map(l => l.map(cell).join(',')).join('\r\n'), 'text/csv');
    toast('Downloaded', 'good');
  },
  install(){
    // The home-screen icon remembers this exact address, so put the connection in it first.
    try { history.replaceState(null, '', location.pathname + joinHash(true)); } catch {}
    const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    openSheet(`<h2>Add Packout to the home screen</h2>
      <div class="panel"><ul class="lines" style="margin:0">${(ios
        ? ['Open this page in <b>Safari</b> if you are in another browser.', 'Tap the <b>Share</b> button (the square with an arrow).', 'Scroll down and tap <b>Add to Home Screen</b>, then <b>Add</b>.']
        : ['Tap the browser menu (the three dots).', 'Tap <b>Add to Home screen</b> or <b>Install app</b>.', 'Confirm with <b>Add</b> or <b>Install</b>.']).map(t => `<li style="border-top:0;padding:6px 0"><span>${t}</span></li>`).join('')}</ul></div>
      <p class="lead">Then close this browser tab and open Packout from the new icon. It opens full screen, already connected.</p>
      <button class="btn" data-act="close-sheet">Done</button>`);
  },
  async invite(){
    const link = location.origin + location.pathname + joinHash(false);
    if (!/^https?:/.test(location.protocol)) toast('Put the app online first. A link to a file on this computer won\'t open on other phones.', 'bad');
    try { if (navigator.share) return await navigator.share({ title: 'Packout', text: 'Open this to start packing', url: link }); } catch (e) { if (e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(link); toast('Invite link copied', 'good'); }
    catch { openSheet(`<h2>Invite link</h2><input type="text" readonly value="${esc(link)}" onfocus="this.select()" autofocus><button class="btn" data-act="close-sheet" style="margin-top:14px">Done</button>`); }
  }
};
async function blocked(row){
  await refresh(true);
  Object.assign(pack, { stage: 'box', pallet: row.pallet_id, known: true, owner: row.created_by, err: '' });
  applyKeep(); render(); scrollTo(0, 0);
}
async function claim(palletId, isNew){
  const run = async () => {
    try {
      await db.insert('styles', { style_number: pack.style, pallet_id: palletId, created_by: me.name });
      data.styles.push({ style_number: pack.style, pallet_id: palletId, created_by: me.name });
      Object.assign(pack, { stage: 'box', pallet: palletId, known: false, err: '' });
      applyKeep(); render(); scrollTo(0, 0);
      if (isNew === true) toast(`New pallet. Write ${pCode(palletId)} on it.`, 'good');
    } catch (e) {
      if (!isDup(e)) return packFail(e);
      const found = await db.get('styles', 'select=*&style_number=' + eq(pack.style));   // someone else got there first
      found[0] ? await blocked(found[0]) : packFail(e);
    }
  };
  return isNew ? run() : withBusy('Assigning style to ' + pCode(palletId), run);
}
async function mutate(label, fn, okMsg){
  await withBusy(label, async () => {
    try { await fn(); await loadAll(); if (okMsg) toast(okMsg, 'good'); }
    catch (e) { toast(e.code === '23503' ? 'This still has things on it, so it can\'t be deleted.' : e.message, 'bad'); }
    render();
  });
}
const setStatus = (table, id, status) => mutate('Saving', () => db.update(table, 'id=' + eq(id), { status }));
function showPhoto(file){
  const w = $('#k-photo-wrap'); if (!w) return;
  w.querySelectorAll('img,.again').forEach(n => n.remove());
  const img = new Image(); img.alt = 'Photo of the item'; img.src = URL.createObjectURL(file);
  w.prepend(img); w.insertAdjacentHTML('beforeend', '<span class="again">Retake</span>');
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (t) { tab = t.dataset.tab; if (tab === 'pallets') palView = null; render(); scrollTo(0, 0); if (tab !== 'pack') refresh(true).then(ok => ok && !sheetOpen() && softRender()); return; }
  const a = e.target.closest('[data-act]');
  if (a && act[a.dataset.act]) return act[a.dataset.act](a);
  if (e.target.id === 'sheet') closeSheet();
});
document.addEventListener('change', e => {
  if (e.target.id === 'k-photo' && e.target.files[0]) { pack.photo = e.target.files[0]; showPhoto(pack.photo); }
  if (e.target.id === 'k-ocr' && e.target.files[0]) { const f = e.target.files[0]; e.target.value = ''; runOcr(f); }
});
document.addEventListener('change', e => { if (e.target.id === 'p-label') { labelSize = e.target.value; store.set('labels', labelSize); } });
document.addEventListener('input', e => { if (e.target.id === 'inv-q') { filt.q = e.target.value; invLimit = 150; renderInvList(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'k-style') act['check-style']();
  if (e.key === 'Escape' && sheetOpen()) closeSheet();
});
window.addEventListener('afterprint', () => $('#print-root').innerHTML = '');
function softRender(){            // refresh what's on screen without disturbing typing
  if (tab === 'inventory') renderInvList();
  else if (tab === 'pallets') render();
}
setInterval(async () => {
  if (!cfg || !me || document.hidden || busyN || sheetOpen()) return;
  if (await refresh(true) && !busyN && !sheetOpen()) softRender();
}, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && cfg && me && !busyN) refresh(true).then(ok => ok && !sheetOpen() && softRender()); });

/* ---------- start ---------- */
(async function start(){
  const m = location.hash.match(/^#join=(.+)$/);
  if (m) { try { const j = JSON.parse(decodeURIComponent(escape(atob(m[1])))); if (j.u && j.k) { cfg = { url: j.u, key: j.k }; store.set('cfg', cfg); if (j.n && !me) { me = { name: j.n }; store.set('me', me); } } } catch {} if (!isStandalone()) history.replaceState(null, '', location.pathname); }
  render();
  if (cfg) { await withBusy('Loading inventory', () => refresh()); render(); }
})();
</script>
</body>
